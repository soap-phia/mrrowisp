name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: windows-latest
            goos: windows
            goarch: arm64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          check-latest: true

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o "mrrowisp${{ matrix.ext }}" main.go

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TS deps
        run: npm i

      - name: Build TypeScript
        run: npx tsc
        env:
          NODE_ENV: production

      - name: Prepare npm package
        run: |
          cp package.json dist/
          cp README.md dist/
          cp LICENSE dist/ 2>/dev/null || true

      - name: Archive npm package
        run: tar -czf mrrowisp-npm.tar.gz -C dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mrrowisp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mrrowisp${{ matrix.ext }}

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: mrrowisp-npm
          path: mrrowisp-npm.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            mrrowisp-*/*
            mrrowisp-npm/*

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package
        run: |
          mkdir -p /tmp/npm-pkg
          tar -xzf mrrowisp-npm/mrrowisp-npm.tar.gz -C /tmp/npm-pkg
          cd /tmp/npm-pkg
          npm publish --provenance --access public
